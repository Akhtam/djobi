# Mirrors apps/dashboard/vite.config.ts's dev `proxy` table: the dashboard calls relative paths, and
# proxying them keeps the session cookie same-origin. Keep the two lists identical, or a route works
# in one setup and 404s in the other. `backend` is the compose service name.

server {
  listen 80;
  server_name _;

  # Above the backend's 5 MiB upload cap, so the app returns its own 400 first.
  client_max_body_size 8m;

  # Docker's DNS, re-resolved every 10s. A variable in `proxy_pass` forces per-request resolution,
  # so recreating the backend container (new IP) doesn't cause 502s until nginx restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:5391;

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /applications {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /profile {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /extract-job {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Routing is in the hash fragment, so there's no SPA fallback: every path is a proxy above or a
  # real static file.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }
}
