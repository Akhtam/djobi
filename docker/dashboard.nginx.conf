# Mirrors apps/dashboard/vite.config.ts's dev-server `proxy` table on purpose — same four path
# prefixes, same reasoning: dashboardClient.ts calls relative paths, and proxying them onto this
# server's own origin is what makes the browser see every request as same-origin rather than
# cross-origin against the `backend` container. That's not a nicety here either — see that file's
# own doc comment for why a cross-origin dashboard↔backend session cookie silently gets dropped.
# `backend` below is the docker-compose service name, resolved over the compose network's own DNS.
#
# Keep this list identical to vite.config.ts's `proxy` object — an entry added to one and not the
# other means a route that works in `pnpm dev:dashboard` and 404s (or the reverse) behind this
# reverse proxy, in a way that only shows up once someone hits that specific path.

server {
  listen 80;
  server_name _;

  # Above apps/backend's own MAX_RESUME_UPLOAD_BYTES (5 MiB, routes/profile.ts) so nginx never
  # rejects an upload before the app gets to answer with its own clean 400.
  client_max_body_size 8m;

  # Docker's embedded DNS, re-queried every 10s. With a literal `proxy_pass http://backend:5391`
  # nginx resolves the name once at startup and pins that IP forever — recreating the backend
  # container (`docker compose up -d --build backend`) can hand it a new IP and every proxied call
  # would 502 until this container restarted. A variable in `proxy_pass` forces per-request
  # resolution through `resolver`. No URI part after the port, so the original request URI is
  # passed through unchanged, same as before.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:5391;

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /applications {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /profile {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /extract-job {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The dashboard's own routing lives entirely in the hash fragment (`#/...`), which never reaches
  # the server — so, unlike a path-based-router SPA, there is no other path to fall back to
  # `index.html` for. Every real path here is either one of the four proxies above or a static
  # asset vite's build already emitted a real file for.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }
}
