packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Pulled in transitively by @better-auth/cli's optional adapters (Prisma, SQLite) — this backend
  # only uses the Drizzle/Postgres adapter, so neither needs its native build step to run.
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.122.0'
  - '@ai-sdk/gateway@4.0.68'
  - '@ai-sdk/provider-utils@5.0.33'
  - ai@7.0.84
