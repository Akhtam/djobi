# `docker compose up` runs db, migrations, backend and the built dashboard on one origin (nginx
# proxies the backend — see docker/dashboard.nginx.conf), with no Node toolchain on the host. The
# same same-origin shape ADR-0001 plans for a real deploy.
#
# A preview, not a dev loop: no hot reload. For development run `pnpm db:up`, `pnpm dev:backend`
# and `pnpm dev:dashboard` (see README.md). The extension is always built on the host
# (`pnpm build:extension`).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Must match apps/backend/.env.example's Docker DATABASE_URL.
      POSTGRES_USER: djobi
      POSTGRES_PASSWORD: djobi
      POSTGRES_DB: djobi
    ports:
      # Every port is published on 127.0.0.1 only; a bare `5432:5432` would expose these well-known
      # credentials on the LAN. If 5432 is taken, change the host side and DATABASE_URL's port.
      - '127.0.0.1:5432:5432'
    volumes:
      - djobi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U djobi -d djobi']
      interval: 2s
      timeout: 5s
      retries: 15

  # One-shot: applies pending migrations (runtime migrator, `dist/db/migrate.js`), then exits;
  # `backend` waits for it. Safe on every `up`.
  migrate:
    build:
      context: .
      target: backend
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://djobi:djobi@db:5432/djobi
    command: ['node', 'dist/db/migrate.js']

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Secrets come from apps/backend/.env; `environment:` below overrides DATABASE_URL to reach the
    # `db` service (127.0.0.1 inside this container is the container itself).
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgres://djobi:djobi@db:5432/djobi
      PORT: '5391'
      # The one place the backend binds 0.0.0.0: inside a container that means the Docker network
      # (nginx), not the LAN.
      HOST: '0.0.0.0'
    ports:
      # The extension always calls http://127.0.0.1:5391 (extensionConfig.ts), container or not.
      - '127.0.0.1:5391:5391'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:5391/healthz || exit 1']
      # Poll fast while starting, then once a minute to keep /healthz out of the logs.
      interval: 60s
      start_interval: 2s
      start_period: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Same port as `pnpm dev:dashboard`.
      - '127.0.0.1:5174:80'

volumes:
  # Named volume: survives `docker compose down`; removed only by `down -v`.
  djobi-postgres-data:
